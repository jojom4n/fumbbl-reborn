name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Qt is BUILT FROM SOURCE in this workflow (official github.com/qt/* mirrors,
# tag v${QT_VERSION}). Reason (03/nov/2026): Qt's "online installer" repository
# (qtsdkrepository) is in flux — old versions (6.8/6.9) were pruned from the
# CDN, the linux desktop repo is gone entirely, and aqtinstall (the tool every
# CI recipe uses) is unmaintained since mid-2025 and still parses the OLD repo
# layout. The official git mirrors are stable, and 6.12.0 is the same Qt the
# client is developed against locally.
#
# Only qtbase + qtwebsockets are built (the whole Qt is NOT — the
# qt-everywhere tarball pulls in 30+ modules and skipping qtdeclarative
# cascades into most of them).
#
# qt.conf next to the executable pins the flat deploy layout, so plugin
# discovery does not depend on the compiled-in Qt prefix.
env:
  QT_VERSION: "6.12.0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Qt build + app runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config git \
            zlib1g-dev libfreetype-dev libpng-dev libjpeg-dev \
            libfontconfig1-dev libdbus-1-dev libssl-dev \
            libx11-dev libxkbcommon-dev libxcb1-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync0-dev libxcb-util-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev
          # note: qtbase's xcb_syslibs compile test links ALL xcb extension
          # libs — if you touch this list, keep it complete or the xcb
          # platform plugin silently drops out of the build

      - name: Qt source (official git mirrors)
        run: |
          git clone --depth 1 --branch "v${QT_VERSION}" https://github.com/qt/qtbase qtbase
          git clone --depth 1 --branch "v${QT_VERSION}" https://github.com/qt/qtwebsockets qtwebsockets

      # Cache the configured + built qtbase tree. The runner workspace path
      # is stable, so the cached CMake tree stays valid between runs.
      - name: Qt cache
        uses: actions/cache@v4
        id: qtcache
        with:
          path: |
            qtbase
            qt
          key: qt6120-ubuntu2404-1

      - name: Build qtbase
        working-directory: qtbase
        run: |
          if [ "${{ steps.qtcache.outputs.cache-hit }}" != "true" ]; then
            ./configure -prefix "${GITHUB_WORKSPACE}/qt" -confirm-license \
              -nomake examples -nomake tests \
              -no-opengl -no-icu -no-glib \
              -no-sql-psql -no-sql-mysql -no-sql-odbc -no-sql-db2 -no-sql-ibase \
              -no-sql-oci -no-sql-mimer \
              -system-zlib -system-freetype
          fi
          cmake --build . -j"$(nproc)"
          cmake --install .

      - name: Qt diagnostics (XCB detection)
        working-directory: qtbase
        run: |
          grep -iE "xcb|x11|xkb" config.summary | head -25
          ls ../qt/plugins/platforms/ 2>/dev/null || echo "no plugins dir"
          for pc in xcb xcb-util xcb-image xcb-keysyms xcb-cursor xcb-icccm xcb-render xcb-render-util xcb-randr xcb-shape xcb-shm xcb-sync xcb-xfixes xcb-xkb xkbcommon-x11; do
            pkg-config --exists "$pc" && echo "pc ok: $pc" || echo "pc MISSING: $pc"
          done

      - name: Build qtwebsockets
        run: |
          cmake -S qtwebsockets -B qtwebsockets/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/qt" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/qt"
          cmake --build qtwebsockets/build -j"$(nproc)"
          cmake --install qtwebsockets/build

      - name: Configure, build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/qt"
          cmake --build build -j"$(nproc)"

      - name: Test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Self-contained bundle + tar.gz
        env:
          QT_PREFIX: ${{ github.workspace }}/qt
        run: |
          tools/make_bundle.sh build
          # headless sanity check of the bundle itself
          QT_QPA_PLATFORM=offscreen "dist/$(ls dist | grep '^FUMBBL-Reborn-.*linux' | head -1)/FUMBBL-Reborn" --smoke

      - name: Build AppImage
        run: |
          curl -L -o appimagetool.x86_64 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.x86_64
          ./appimagetool.x86_64 --appimage-extract
          sudo mv Squashfs-root /appimage-extract

          DIST_DIR=$(ls -d dist/FUMBBL-Reborn-*/ | grep -v tar.gz)
          TARBALL=$(ls dist/*.tar.gz)
          BASE=$(basename "$TARBALL" .tar.gz)          # FUMBBL-Reborn-<ver>-linux-x86_64
          APPIMG="dist/${BASE/-linux/}.AppImage"       # FUMBBL-Reborn-<ver>-x86_64.AppImage

          # AppDir: flat layout in usr/bin (RPATH=$ORIGIN), qt.conf included
          APPDIR=/tmp/AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -a "${DIST_DIR}FUMBBL-Reborn" "${DIST_DIR}qt.conf" "$APPDIR/usr/bin/"
          cp -a "${DIST_DIR}"libQt6*.so* "$APPDIR/usr/bin/"
          cp -a "${DIST_DIR}plugins" "$APPDIR/usr/bin/"
          cp -a "${DIST_DIR}assets" "$APPDIR/"
          # appimagetool requires the .desktop at the AppDir root
          cp "$APPDIR/usr/share/applications/FUMBBL-Reborn.desktop" "$APPDIR/"

          sudo /appimage-extract/AppImageRunner --appimage-extract "$APPDIR" \
            -o "$APPIMG" --mksquashfs-opt="-no-I"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_PREFIX: ${{ github.workspace }}\qt6120
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 + MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl

      - name: Qt source (official git mirrors)
        shell: bash
        run: |
          git clone --depth 1 --branch "v${QT_VERSION}" https://github.com/qt/qtbase qtbase
          git clone --depth 1 --branch "v${QT_VERSION}" https://github.com/qt/qtwebsockets qtwebsockets

      - name: Qt cache
        uses: actions/cache@v4
        id: qtcache
        with:
          path: |
            qtbase
            qt6120
          key: qt6120-windows-1

      - name: Build qtbase (MinGW)
        shell: bash
        run: |
          cd qtbase
          QT_PREFIX_UNIX="$(cygpath -u "$GITHUB_WORKSPACE")/qt6120"
          if [ "${{ steps.qtcache.outputs.cache-hit }}" != "true" ]; then
            ./configure -prefix "$QT_PREFIX_UNIX" -confirm-license \
              -nomake examples -nomake tests \
              -no-opengl -no-icu -no-glib \
              -no-sql-psql -no-sql-mysql -no-sql-odbc -no-sql-db2 -no-sql-ibase \
              -no-sql-oci -no-sql-mimer
          fi
          cmake --build . -j4
          cmake --install .

      - name: Qt diagnostics (tools + plugins)
        shell: bash
        run: |
          ls "$(cygpath -u "$GITHUB_WORKSPACE")/qt6120/libexec" 2>/dev/null | head
          ls "$(cygpath -u "$GITHUB_WORKSPACE")/qt6120/plugins/platforms" 2>/dev/null || echo "no platforms"

      - name: Build qtwebsockets (MinGW)
        shell: bash
        run: |
          QT_PREFIX_UNIX="$(cygpath -u "$GITHUB_WORKSPACE")/qt6120"
          cmake -S qtwebsockets -B qtwebsockets/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX_UNIX" \
            -DCMAKE_INSTALL_PREFIX="$QT_PREFIX_UNIX"
          cmake --build qtwebsockets/build -j4
          cmake --install qtwebsockets/build

      - name: Configure, build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX"
          cmake --build build -j4

      - name: Stage + windeployqt + qt.conf
        run: |
          cmake --install build --prefix staging
          # source builds put the tools in libexec, official installs in bin
          $wdq = "$env:QT_PREFIX\bin\windeployqt.exe"
          if (-not (Test-Path $wdq)) { $wdq = "$env:QT_PREFIX\libexec\windeployqt.exe" }
          & $wdq --release --no-translations --compiler-runtime staging\FUMBBL-Reborn.exe
          # pin the flat layout (plugins next to the exe)
          Set-Content -Path "staging\qt.conf" -Value "[Paths]`nPrefix = .`nPlugins = plugins`n"

      - name: Zip
        run: |
          New-Item -ItemType Directory -Force -Path "dist\FUMBBL-Reborn-${env:QT_VERSION}-windows-x86_64"
          Copy-Item -Recurse -Force "staging\*" "dist\FUMBBL-Reborn-${env:QT_VERSION}-windows-x86_64\"
          Compress-Archive -Path "dist\FUMBBL-Reborn-${env:QT_VERSION}-windows-x86_64" -DestinationPath "dist\FUMBBL-Reborn-${env:QT_VERSION}-windows-x86_64.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
