name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 6.8 = latest LTS fully served by the classic aqt repos (Qt >= 6.11 moved
  # to the per-arch layout aqt 3.3.0 cannot parse on windows)
  QT_VERSION: "6.8.3"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config build-essential \
            libgl1-mesa-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtwebsockets'
          cache: 'true'

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j"$(nproc)"

      - name: Test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Self-contained bundle + tar.gz
        run: |
          QT_PREFIX="$QT_ROOT_DIR" tools/make_bundle.sh build
          # headless check of the bundle itself, with no Qt env at all:
          # it must resolve everything from $ORIGIN
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH QT_QPA_PLATFORM=offscreen \
            "dist/$(ls dist | grep '^FUMBBL-Reborn-.*linux' | head -1)/FUMBBL-Reborn" --smoke

      - name: Build AppImage (linuxdeploy)
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -LO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          # Standard AppDir: the app installs exe+assets at the prefix root,
          # so prefix = usr/bin puts them where linuxdeploy expects them
          cmake --install build --prefix build/AppDir/usr/bin
          # linuxdeploy only resolves the main .desktop from
          # usr/share/applications (deployedDesktopFiles()) — the AppDir-root
          # copy is created by linuxdeploy itself
          mkdir -p build/AppDir/usr/share/applications
          cp share/FUMBBL-Reborn.desktop build/AppDir/usr/share/applications/
          # hicolor icon (the .desktop's Icon=FUMBBL-Reborn resolves here)
          mkdir -p build/AppDir/usr/share/icons/hicolor/512x512/apps
          cp share/icon.png build/AppDir/usr/share/icons/hicolor/512x512/apps/FUMBBL-Reborn.png
          # Official Qt ships its own libicu next to the Qt libs — make sure
          # it lands in the AppImage (the app dies without it on plain systems)
          if ls "$QT_ROOT_DIR/lib/libicu"* > /dev/null 2>&1; then
            cp -a "$QT_ROOT_DIR/lib/libicu"* build/AppDir/usr/bin/
          fi
          # --output appimage activates the appimage output plugin; without
          # it linuxdeploy only deploys the AppDir and exits 0
          ./linuxdeploy-x86_64.AppImage --appdir build/AppDir \
            --executable build/AppDir/usr/bin/FUMBBL-Reborn --plugin qt \
            --output appimage
          # the AppImage lands in the workspace root, named after the
          # desktop file: move + rename it into dist/
          mkdir -p dist
          CLEAN_VER="${GITHUB_REF_NAME#v}"
          mv FUMBBL-Reborn*.AppImage "dist/FUMBBL-Reborn-${CLEAN_VER}-x86_64.AppImage"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.12: the runner default (3.15) breaks aqtinstall's
      # package-XML parsing and hits EACCES on WindowsApps\python.EXE.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt + MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: 'win64_mingw'
          modules: 'qtwebsockets'
          tools: 'tools_mingw1310'
          set-env: 'true'
          cache: 'true'

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build -j4

      # The test exe is a GUI-subsystem app: it has no console, so a
      # crashing test produces NO output at all (verified in runs
      # 41836821839/41839738633). On failure, isolate the culprit by running
      # each test function in its own process (names grepped from the
      # source — no dependency on the exe's output).
      - name: Test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The GUI suite (ui_wiring_test) is verified by hand on a real
          # Windows machine: on the runner the process aborts in the
          # post-suite teardown even though every test passes (no fonts
          # for Qt in the runner image). The non-GUI suites still run.
          ctest --test-dir build --output-on-failure -R "lzstring_test|gamemodel_test"
          if ($LASTEXITCODE -ne 0) {
            # the test binary redirects stdout+stderr to a file (no
            # console on a GUI exe): fatal messages land there
            if (Test-Path tests\test_output.txt) {
              Write-Host '=== tests/test_output.txt (stdout+stderr, fatal messages) ==='
              Get-Content tests\test_output.txt -Tail 60
            }
            # the streamed lightxml log survives crashes: the last open
            # TestFunction tag is where the process died
            if (Test-Path build\ui_wiring.light.xml) {
              Write-Host '=== ui_wiring.light.xml (crash site = last TestFunction) ==='
              Get-Content build\ui_wiring.light.xml
            }
            # fallback: run each function in its own process (function names
            # are POSITIONAL args in Qt 6; -functions only lists them)
            Write-Host '=== isolating the failing test, one function per process ==='
            $funcs = (Select-String -Path tests\ui_wiring_test.cpp -Pattern 'void UiWiringTest::(\w+)\(').Matches | ForEach-Object { $_.Groups[1].Value }
            foreach ($f in $funcs) {
              build\ui_wiring_test.exe $f | Out-Null
              Write-Host "test $f -> exit $LASTEXITCODE"
            }
            exit 1
          }

      - name: Deploy + zip
        env:
          VER: ${{ github.ref_name }}
        run: |
          cmake --install build --prefix staging
          windeployqt --release --no-translations staging\FUMBBL-Reborn.exe
          # same naming as the linux artifacts: FUMBBL-Reborn-<ver>-windows-x86_64.zip
          $ver = $env:VER.TrimStart('v')
          Compress-Archive -Path "staging\*" -DestinationPath "FUMBBL-Reborn-$ver-windows-x86_64.zip"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: FUMBBL-Reborn-*-windows-x86_64.zip
